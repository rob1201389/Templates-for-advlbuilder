<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Ad Builder — Dealer Templates</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ======= Login gate ======= -->
  <div id="login-overlay">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-brand">
        <span class="brand-dot"></span>
        <h1>Social Ad Builder</h1>
        <p>Dealer social &amp; display ad templates</p>
      </div>
      <h2 id="login-title">Sign in</h2>
      <label class="field"><span>Email</span>
        <input id="login-email" type="email" required autocomplete="username">
      </label>
      <label class="field"><span>Password</span>
        <input id="login-password" type="password" required minlength="6" autocomplete="current-password">
      </label>
      <p id="login-error" class="error"></p>
      <button id="login-submit" class="btn primary wide" type="submit">Sign in</button>
      <button id="login-mode-toggle" class="btn link wide" type="button">New here? Create an account</button>
      <p class="note">Accounts are stored in this browser only.</p>
    </form>
  </div>

  <!-- ======= App ======= -->
  <header class="topbar">
    <div class="topbar-brand"><span class="brand-dot"></span> Social Ad Builder</div>
    <div class="topbar-user">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn small">Log out</button>
    </div>
  </header>

  <main class="layout">
    <!-- ---- Controls ---- -->
    <aside class="sidebar">
      <section class="panel">
        <h3>1 · Template</h3>
        <div id="template-picker" class="tpl-grid"></div>
      </section>

      <section class="panel">
        <h3>2 · Vehicle &amp; offer</h3>
        <label class="field"><span>Dealer name</span>
          <input id="f-dealer" type="text" placeholder="e.g. Melbourne City Toyota">
        </label>

        <label class="field"><span>Model</span>
          <select id="f-model"></select>
        </label>
        <div id="f-model-other-wrap" class="other-row" hidden>
          <input id="f-model-other" type="text" placeholder="Type model name">
          <button id="save-model" class="btn small" type="button" title="Save to my list">＋ Save</button>
        </div>

        <label class="field"><span>Grade</span>
          <select id="f-grade"></select>
        </label>
        <div id="f-grade-other-wrap" class="other-row" hidden>
          <input id="f-grade-other" type="text" placeholder="Type grade">
          <button id="save-grade" class="btn small" type="button" title="Save to my list">＋ Save</button>
        </div>

        <label class="field"><span>Colour</span>
          <select id="f-colour"></select>
        </label>
        <div id="f-colour-other-wrap" class="other-row" hidden>
          <input id="f-colour-other" type="text" placeholder="Type colour">
          <button id="save-colour" class="btn small" type="button" title="Save to my list">＋ Save</button>
        </div>

        <label class="field"><span>Price (driveaway)</span>
          <input id="f-price" type="text" placeholder="e.g. $72,650">
        </label>
      </section>

      <section class="panel">
        <h3>3 · Copy</h3>
        <div id="dyn-fields"></div>
        <label class="field"><span>Disclaimer (small print)</span>
          <textarea id="f-disclaimer" rows="3" placeholder="*Driveaway price for [model/grade] sold and delivered by [date]. Excludes demonstrators. See dealer for details."></textarea>
        </label>
      </section>

      <section class="panel">
        <h3>4 · Brand &amp; imagery</h3>
        <label class="field"><span>Accent colour (masterbrand palette)</span>
          <span class="accent-row">
            <input id="f-accent" type="color" value="#EB0A1E">
            <span id="swatches" class="swatches"></span>
          </span>
        </label>
        <label class="field"><span>Vehicle / background photo</span>
          <input id="f-bg" type="file" accept="image/*">
        </label>
        <label class="field"><span>Dealer composite logo / Toyota product logo (transparent PNG from AdBuilder)</span>
          <input id="f-logo" type="file" accept="image/*">
        </label>
        <label class="field"><span>OWAF tagline logo (official “OH WHAT A FEELING” file from AdBuilder — never typed out)</span>
          <input id="f-owaf" type="file" accept="image/*">
        </label>
        <label class="field"><span>OWAF placement</span>
          <select id="f-owaf-pos">
            <option value="auto">Auto (per template)</option>
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
            <option value="bottom-left">Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>
        </label>
        <label class="field"><span>Toyota Type font file (optional .woff2/.ttf/.otf — Arial is used until loaded, per guidelines)</span>
          <input id="f-font" type="file" accept=".woff,.woff2,.ttf,.otf">
        </label>
      </section>

      <section class="panel">
        <h3>5 · Output sizes</h3>
        <div id="size-checks"></div>
        <button id="download-all" class="btn primary wide">⬇ Download selected sizes (PNG)</button>
      </section>
    </aside>

    <!-- ---- Previews ---- -->
    <section class="stage">
      <div id="preview-grid" class="preview-grid"></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
